name: Horizon Daily Digest
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
env:
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
permissions:
  contents: write
jobs:
  horizon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run Horizon
        run: uv run horizon --hours 48
      - name: Push docs to docs-output branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp -f data/summaries/*.md docs/
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily digest"
          git push origin HEAD:docs-output --force
      - name: Sync to Obsidian digest repo
        if: success()
        run: |
          TODAY=$(date +%Y-%m-%d)
          git clone https://x-access-token:${{ secrets.CROSS_REPO_TOKEN }}@github.com/freefenghua/horizon-digest.git /tmp/digest
          cp data/summaries/horizon-${TODAY}-zh.md /tmp/digest/
          cd /tmp/digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "${TODAY} 日报"
          git push
