name: Horizon Daily Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  horizon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        run: uv run horizon --hours 24

      - name: Deploy to GitHub Pages
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git checkout gh-pages || git checkout -b gh-pages
          cp -f data/summaries/*.md docs/ 2>/dev/null || true
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily digest"
          git push origin gh-pages || git push -u origin gh-pages
