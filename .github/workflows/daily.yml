name: Horizon Daily Digest
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
env:
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
permissions:
  contents: write
jobs:
  horizon:
    runs-on: ubuntu-latest
    steps:
      # 基于 docs-output 检出，保证历史日报逐日追加而不被覆盖
      - uses: actions/checkout@v4
        with:
          ref: docs-output
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run Horizon
        run: uv run horizon --hours 48
      - name: Push docs to docs-output branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp -f data/summaries/*.md docs/
          # 重新生成日报存档目录页（GitHub Pages 首页）
          python3 scripts/gen_index.py
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily digest"
          # 正常追加提交，禁止 force push，避免清空历史日报
          git push origin HEAD:docs-output
      - name: Notify WeChat via ServerChan
        if: success()
        run: python3 scripts/notify_serverchan.py
