name: Horizon Daily Digest
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
env:
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
permissions:
  contents: write
jobs:
  horizon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run Horizon
        run: uv run horizon --hours 24
      - name: Commit docs to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp -f data/summaries/*.md docs/
          git add docs/
          git diff --staged --quiet || (git commit -m "Update daily digest" && git pull --rebase origin main && git push)
